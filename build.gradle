plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:6.0.0'

    testImplementation 'org.apache.groovy:groovy-test:6.0.0'
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'demo.Main'
}

tasks.named('test') {
    useJUnit()
}
