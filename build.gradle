plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:6.0.0'

    testImplementation 'org.apache.groovy:groovy-test:6.0.0'
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'demo.Main'
}

// Groovy's type-checking extension scripts are loaded from the compilation classpath.
// Keep the script in src/main/groovy, but also expose it as a classpath resource.
tasks.named('processResources') {
    from('src/main/groovy/demo/ContainerDslExtension.groovy') {
        into 'demo'
    }
}

// The extension must exist on the classpath before compileGroovy starts.
tasks.named('compileGroovy') {
    dependsOn tasks.named('processResources')
    classpath += files(layout.buildDirectory.dir('resources/main'))
}

tasks.named('test') {
    useJUnit()
}
